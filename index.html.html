<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sui An's Birthday Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column; a dark passport cover, then bright "visa pages" per station; illustrations sit in round sticker frames */
:root{
  --pink:#FF4D6D; --peach:#FFB3A7; --sun:#FFD166; --mint:#06D6A0; --sea:#118AB2;
  --ink:#14213d; --paper:#fff7f3; --card:#ffffff; --line:#f2dcd5; --muted:#596277; --soft:#ffe9e3;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:700 16px var(--body);cursor:pointer;border-radius:12px;min-height:48px;padding:0 18px;border:2px solid var(--ink);background:var(--ink);color:#fff}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.big{min-height:56px;font-size:17px;width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
input[type=text],input[type=password],select{font:16px var(--body);min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);width:100%;min-width:0}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;line-height:1.05}
p{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px}
.tabs button{min-height:38px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:14px;padding:0 14px}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.chip{font-family:var(--mono);font-size:13px;font-weight:600;background:var(--sun);border-radius:999px;padding:7px 12px;white-space:nowrap}

/* cover */
.cover{background:var(--ink);color:#fff;border-radius:22px;padding:26px 22px 24px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(255,255,255,.22);border-radius:14px;pointer-events:none}
.cover .label{color:var(--peach)}
.cover h1{font-size:clamp(36px,10vw,46px)}
.cover h1 em{font-style:normal;color:var(--sun)}
.cover p{color:#e8ebf3;max-width:34ch}
.stickers{position:relative;height:210px;margin:4px 0}
.stickers .sticker{position:absolute;width:132px;height:132px}
.stickers .s1{left:0;top:10px;transform:rotate(-9deg)}
.stickers .s2{left:28%;top:62px;transform:rotate(6deg);z-index:2}
.stickers .s3{right:22%;top:0;transform:rotate(-4deg)}
.stickers .s4{right:0;top:70px;transform:rotate(10deg);z-index:3}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:#cfd5e3}
.stats b{display:block;font-family:var(--display);font-size:28px;color:var(--sun);line-height:1.1}
.cover button{background:var(--sun);color:var(--ink);border-color:var(--sun)}

/* stickers / icons */
.sticker{border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 0 3px var(--c,var(--pink));background:var(--c,var(--pink));display:flex;align-items:center;justify-content:center;flex:none}
.sticker img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.12)}
.sticker svg{width:56%;height:56%}
.sticker.logo{background:#000}
.sticker.logo img{object-fit:contain;transform:none;width:84%;height:auto}
.ph{border:2px dashed var(--muted);border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--soft);text-align:center;padding:10px}

/* pages */
.page{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:relative}
.head{display:flex;gap:16px;align-items:center}
.head .sticker{width:96px;height:96px}
.head h2{font-size:30px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.progress{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.progress span{height:8px;border-radius:4px;background:var(--line)}
.missions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.missions label{display:flex;gap:12px;align-items:center;min-height:52px;border-top:1.5px dashed var(--line);cursor:pointer}
.missions li:first-child label{border-top:0}
.missions input{width:24px;height:24px;accent-color:var(--mint);margin:0;flex:none}
.missions input:checked+span{color:var(--muted);text-decoration:line-through}
.note{font-size:14px;color:var(--muted);text-align:center}
.pill{display:inline-flex;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.qtext{font-size:30px;line-height:1.12}
.callout{background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:16px}
.callout svg{flex:none;margin-top:2px}

/* judge */
.judge{background:var(--ink);color:#fff;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.judge .label{color:var(--peach)}
.judge input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:#fff}
.judge ul{margin:0;padding-left:18px;color:#d9deea;font-size:15px}
.scores{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scores button{min-height:64px;font:800 28px var(--display);background:transparent;color:#fff;border:2px solid rgba(255,255,255,.35);padding:0}
.scores button[aria-pressed=true]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.dbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dbs button{min-height:64px;padding:6px;background:transparent;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
.dbs svg,.dbrow svg{width:100%;max-width:52px;fill:rgba(255,255,255,.28)}
.dbs button.on{border-color:var(--sun);background:rgba(255,209,102,.12)}
.dbs button.on svg{fill:var(--sun)}
.dbrow{display:flex;gap:8px;justify-content:center}
.dbrow span{width:44px;display:flex}
.dbrow svg{fill:var(--line)}
.dbrow .on svg{fill:var(--pink)}
.maplink{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;background:#fff;color:var(--ink);font-weight:700;text-decoration:none;margin-top:4px}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#c3cad9}
.tally{border-top:1.5px dashed rgba(255,255,255,.3);padding-top:12px;font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;gap:4px}
.tally div{display:flex;justify-content:space-between}
.tally b{color:var(--sun)}
.judge button.go{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.err{color:var(--pink);font-size:14px;min-height:1.2em}
.judge .err{color:var(--peach)}

/* stamp */
.stamp{width:160px;height:160px;border-radius:50%;background:var(--c);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;transform:rotate(-10deg);
  box-shadow:inset 0 0 0 6px var(--c),inset 0 0 0 8px rgba(20,33,61,.55);align-self:center;line-height:1.3}
.stamp.light{color:#fff;box-shadow:inset 0 0 0 6px var(--c),inset 0 0 0 8px rgba(255,255,255,.7)}
.stamp b{font-family:var(--display);font-size:28px;letter-spacing:0;text-transform:none;line-height:1.05}
.stamp.drop{animation:drop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes drop{from{transform:rotate(-10deg) scale(2.4);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
.verdict{font-family:var(--display);font-weight:800;font-size:34px;text-align:center}
.quote{font-style:italic;text-align:center;color:#3c4558;font-size:17px}
.next{background:var(--sea);color:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px}
.next .label{color:#e6f4fa}
.next h3{font-size:30px}

/* passport */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.slot{background:#fff;border:2px solid var(--line);border-radius:18px;min-height:190px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.slot .sticker{width:92px;height:92px}
.slot.now{border-color:var(--ink);border-style:dashed}
.slot.locked{opacity:.55}
.slot .q{width:92px;height:92px;border-radius:50%;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font:800 34px var(--display);color:var(--muted)}
.slot small{font-size:14px;line-height:1.25}
.badge{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--sun);border-radius:999px;padding:3px 10px}
.slot.prize{background:var(--ink);color:#fff;border-color:var(--ink)}

/* finale */
.finale{background:var(--ink);color:#fff;border-radius:22px;padding:26px 20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.finale .label{color:var(--peach)}
.finale h1{font-size:clamp(36px,10vw,46px);color:var(--sun)}
.card5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center;font-family:var(--mono);font-size:11px;color:#cfd5e3}
.card5 b{display:block;font-family:var(--display);font-size:26px;color:#fff}
.claim{background:#fff;color:var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.claim .sticker{width:150px;height:150px}
.scratch{position:relative;width:100%;border-radius:18px;overflow:hidden;background:#fff;min-height:300px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
.scratch img{width:100%;max-height:380px;object-fit:contain;display:block}
.scratch .ph{width:100%;min-height:300px;border-radius:0}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.scratch.open canvas{transition:opacity .7s;opacity:0;pointer-events:none}
.prizecap{font-family:var(--display);font-weight:800;font-size:26px;text-align:center;color:var(--sun)}

/* game master */
.foot{display:flex;justify-content:center}
.foot button{min-height:36px;font-size:13px;border:0;background:transparent;color:var(--muted);text-decoration:underline}
.gm{background:#fff;border:2px dashed var(--muted);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.gmrow{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;font-size:15px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
/* palette-forward surfaces */
:root{--paper:#fff3f0;--line:#ffd6cd;--soft:#ffe6e0}
button{background:var(--pink);border-color:var(--pink);color:var(--ink)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.tabs button[aria-pressed=true]{background:var(--sea);color:#fff}
.cover{background:var(--sea)}
.cover .label{color:var(--sun)}
.cover p{color:#fff;font-weight:600;font-size:17px}
.stats{color:#fff}
.judge{background:var(--pink);color:var(--ink)}
.judge .label,.judge ul,.scale{color:var(--ink)}
.judge .err{color:var(--ink);font-weight:700}
.judge input{background:#fff;border-color:rgba(20,33,61,.3);color:var(--ink)}
.dbs button{border-color:rgba(20,33,61,.3);background:rgba(255,255,255,.18)}
.dbs svg{fill:rgba(20,33,61,.25)}
.dbs button.on{border-color:var(--ink);background:rgba(255,255,255,.45)}
.dbs button.on svg{fill:var(--ink)}
.tally{border-top-color:rgba(20,33,61,.35)}
.tally b{color:var(--ink)}
.judge button.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.finale{background:var(--sea)}
.finale .label{color:var(--sun)}
.card5{color:#fff}
.finale .err{color:#fff!important;font-weight:700}
.next{background:var(--mint);color:var(--ink)}
.next .label{color:var(--ink)}
.maplink{background:var(--ink);color:#fff}
.slot.prize{background:var(--sea);border-color:var(--sea)}
.dbrow .on svg{fill:var(--pink)}
@media (prefers-reduced-motion:reduce){.stamp.drop{animation:none}.scratch.open canvas{transition:none}}
</style>
</head><body>

try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.scores) S = Object.assign(blank(), s); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const ui = {view:"flow", judgeOk:false, pick:null, note:"", fresh:false, gmOpen:false, gmOk:false, confetti:false, resetArmed:false};

const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST = () => CONFIG.stations[S.station];
const total = () => S.scores.reduce((a,b) => a + (b||0), 0);
const lost = () => S.scores.reduce((a,b) => a + (b==null ? 0 : 5-b), 0);
const canDrop = () => Math.max(0, (25 - CONFIG.passMark) - lost());
const lightText = c => c === "--sea";

function icon(key, color, cls="", fallback) {
  const c = `style="--c:var(${color})"`;
  if (SVG[key]) return `<div class="sticker ${cls}" ${c}>${SVG[key]}</div>`;
  if (!CONFIG.images[key] && fallback) key = fallback;
  const src = CONFIG.images[key];
  if (src && key === "revl") return `<div class="sticker logo ${cls}" ${c}><img src="${esc(src)}" alt="REVL"></div>`;
  if (src) return `<div class="sticker ${cls}" ${c}><img src="${esc(src)}" alt=""></div>`;
  return `<div class="sticker ${cls}" ${c}><div class="ph" style="border:0;background:transparent;font-size:10px">IMAGE: ${esc(key)}</div></div>`;
}
function stampHTML(i, drop) {
  const st = CONFIG.stations[i];
  return `<div class="stamp ${lightText(st.color)?"light":""} ${drop?"drop":""}" style="--c:var(${st.color})">${esc(st.where)}<b>${esc(st.stamp)}</b>${st.time.slice(0,5)} · ${S.scores[i]}/5</div>`;
}
const pinField = (id, dark) => `<label class="label" for="${id}">PIN</label>
  <input type="password" id="${id}" inputmode="numeric" autocomplete="off" maxlength="6">`;

function topBar() {
  return `<div class="bar"><div class="tabs" role="group" aria-label="View">
    <button data-a="view-flow" aria-pressed="${ui.view!=="passport"}">Today</button>
    <button data-a="view-passport" aria-pressed="${ui.view==="passport"}">Passport</button></div>
    <span class="chip">${total()} / 25</span></div>`;
}

function vPack() {
  const done = CONFIG.packing.filter((_,k)=>S.packed[k]).length;
  return `<header class="cover">
    <div class="label">Before you go · ${done}/${CONFIG.packing.length} packed</div>
    <h1>Pack your <em>bag</em></h1>
    <p>Your birthday plans are top secret. Dress comfortable and casual, ready for some light activity. Here's what to bring.</p>
  </header>
  <section class="page">
    <div class="label">Packing list</div>
    <ul class="missions">${CONFIG.packing.map((m,k)=>`<li><label><input type="checkbox" id="p${k}" data-p="${k}" ${S.packed[k]?"checked":""}><span>${esc(m)}</span></label></li>`).join("")}</ul>
  </section>
  <button class="big" data-a="packed">${done === CONFIG.packing.length ? "All packed · open the passport" : "Open the passport"}</button>`;
}

function vCover() {
  return `<header class="cover">
    <div class="label">Birthday passport · destinations classified</div>
    <h1>${esc(CONFIG.player)}'s <em>Birthday Quest</em></h1>
    <p>Five stations. Complete the missions, answer honestly, collect the stamps. Score ${CONFIG.passMark}/25 to win your prize.</p>
    <div class="stickers" aria-hidden="true">
      ${icon("hyrox","--pink","s1")}${icon("mystery","--sun","s2")}${icon("mystery","--mint","s3")}${icon("mystery","--peach","s4")}
    </div>
    <div class="stats"><div><b>${total()}</b>score</div><div><b>${S.scores.filter(x=>x!=null).length}/5</b>stamps</div><div><b>${CONFIG.age}</b>today</div></div>
    <button class="big" data-a="start">${S.scores.some(x=>x!=null) ? "Continue the quest" : "Open the passport"}</button>
  </header>`;
}

function progressBar() {
  return `<div class="progress" aria-hidden="true">${CONFIG.stations.map((s,i)=>`<span style="${S.scores[i]!=null?`background:var(${s.color})`:i===S.station?"background:var(--ink)":""}"></span>`).join("")}</div>`;
}

function vStation() {
  const st = ST(), i = S.station;
  const all = st.missions.every((_,k) => S.missions[i+"-"+k]);
  return `${progressBar()}
  <section class="page">
    <div class="head">${icon(st.icon, st.color, "", st.fallback)}<div style="min-width:0;display:flex;flex-direction:column;gap:4px">
      <div class="meta">Station ${i+1} of 5 · ${st.time}</div><h2>${esc(st.venue)}</h2></div></div>
    <p style="font-size:17px">${esc(st.brief)}</p>
  </section>
  <section class="page">
    <div class="label">Missions</div>
    <ul class="missions">${st.missions.map((m,k)=>`<li><label><input type="checkbox" id="m${i}-${k}" data-m="${i}-${k}" ${S.missions[i+"-"+k]?"checked":""}><span>${esc(m)}</span></label></li>`).join("")}</ul>
  </section>
  <p class="note">${all ? `${st.questions.length} question${st.questions.length>1?"s":""} unlocked` : "Tick every mission to unlock the questions"}</p>
  <button class="big" data-a="questions" ${all?"":"disabled"}>Start the questions</button>`;
}

function vQuestion() {
  const st = ST(), n = st.questions.length, red = S.redemption.active;
  return `${progressBar()}
  <section class="page">
    <div class="row" style="justify-content:space-between">
      <div class="meta">${red ? "Redemption round" : `Station ${S.station+1}`} · Q${S.q+1} of ${n}</div>
      <span class="pill" style="background:var(${st.color});color:${lightText(st.color)?"#fff":"var(--ink)"}">${esc(st.venue)}</span>
    </div>
    <div class="row"><span class="pill" style="background:var(--soft)">Reflect</span><span class="pill" style="background:var(--soft)">Answer out loud</span></div>
    <h2 class="qtext">${esc(st.questions[S.q])}</h2>
    <div class="callout"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14213d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      <span>Tell your wifey your answer. ${S.q+1<n ? "One more question after this." : "Then hand her the phone to score this station."}</span></div>
  </section>
  <button class="big" data-a="told">${S.q+1<n ? "I've told her · next question" : "I've told her · hand over the phone"}</button>`;
}

function vJudge() {
  const st = ST();
  if (!ui.judgeOk) return `<section class="judge">
    <div class="label">Judge's panel · Station ${S.station+1}</div>
    <h2 style="font-size:30px">Hand the phone to your wifey</h2>
    <p style="color:#d9deea">Only the judge can score. Enter the PIN to continue.</p>
    <form id="judgePin" class="row" style="flex-direction:column;align-items:stretch;gap:8px">${pinField("jp")}<p class="err" id="jerr"></p>
    <button class="go big" type="submit">Unlock</button></form></section>`;
  const p = ui.pick, after = total() - (S.scores[S.station]||0) + (p||0);
  return `<section class="judge">
    <div class="label">Judge's panel · ${S.redemption.active ? "Redemption · " : ""}Station ${S.station+1}</div>
    <h2 style="font-size:30px">How did he do?</h2>
    <ul>${st.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>
    <div class="dbs" role="group" aria-label="Score in dumbbells">${[1,2,3,4,5].map(n=>`<button data-score="${n}" class="${p && n<=p ? "on" : ""}" aria-pressed="${p===n}" aria-label="${n} dumbbell${n>1?"s":""}">${DB}</button>`).join("")}</div>
    <div class="scale"><span>Brushed it off</span><span>Honest</span><span>Moved me</span></div>
    <div class="tally"><div><span>${p ? `${p} dumbbell${p>1?"s":""} · total after this station` : "Total after this station"}</span><b>${after} / 25</b></div></div>
    <button class="go big" data-a="confirm" ${p?"":"disabled"}>${p?`Confirm and stamp`:"Pick the dumbbells"}</button>
  </section>`;
}

function vStamped() {
  const i = S.station, st = ST(), last = i === 4, nx = CONFIG.stations[i+1];
  const drop = ui.fresh; ui.fresh = false;
  return `${progressBar()}
  <section class="page" style="align-items:center;gap:16px">
    <div class="meta">Station ${i+1} complete · ${total()} / 25</div>
    <div class="verdict">Judge says ${S.scores[i]}/5</div>
    <div class="dbrow" aria-label="${S.scores[i]} of 5 dumbbells">${[1,2,3,4,5].map(n=>`<span class="${n<=S.scores[i]?"on":""}">${DB}</span>`).join("")}</div>
    ${stampHTML(i, drop)}
  </section>
  ${last ? `<button class="big" data-a="tofinale">See your result</button>` :
  `<section class="next"><div class="label">Next stop unlocked · ${nx.time.slice(0,5)}</div><h3>${esc(nx.venue)}</h3>
    ${nx.map ? `<a class="maplink" href="${esc(nx.map)}" target="_blank" rel="noopener">${esc(nx.mapLabel || "Open in Google Maps")} ↗</a>` : ""}</section>
  <button class="big" data-a="nextstation">Go to station ${i+2}</button>`}`;
}

function lowest() { let low = 0, m = 9; S.scores.forEach((s,i)=>{ if (s!=null && s<=m){ m=s; low=i; } }); return low; }

function vFinale() {
  const t = total(), won = t >= CONFIG.passMark || S.mercy;
  const card = `<div class="card5">${CONFIG.stations.map((s,i)=>`<span>${esc(s.stamp)}<b>${S.scores[i]??"–"}</b></span>`).join("")}</div>`;
  if (!won) {
    const low = lowest();
    if (!S.redemption.used) return `<section class="finale">
      <div class="label">Final score</div><h1>So close!</h1>
      <p>${t} / 25. You need ${CONFIG.passMark}.</p>${card}
      <p>One chance to fix it: answer the ${esc(CONFIG.stations[low].venue)} questions again. The judge will score that station again, and the new score replaces the old one.</p>
      <button class="big" data-a="redeem" style="background:var(--sun);color:var(--ink);border-color:var(--sun)">Start the redemption round</button></section>`;
    return `<section class="finale">
      <div class="label">After redemption · ${t} / 25</div><h1>Judge's decision</h1>${card}
      <p>Still short of ${CONFIG.passMark}. The judge decides what happens next.</p>
      <form id="mercyForm" style="display:flex;flex-direction:column;gap:8px">${pinField("mp")}<p class="err" id="merr" style="color:var(--peach)"></p>
      <button class="big" type="submit" style="background:var(--sun);color:var(--ink);border-color:var(--sun)">Grant prize anyway (judge's mercy)</button></form></section>`;
  }
  let claim;
  if (!S.claimed) claim = `<div class="claim">${icon("heart","--peach")}
      <p style="font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15">${esc(CONFIG.claimText)}</p>
      <form id="claimForm" style="display:flex;flex-direction:column;gap:8px;width:100%;text-align:left">${pinField("cp")}<p class="err" id="cerr"></p>
      <button class="big" type="submit">Claim approved</button></form></div>`;
  else claim = `<p class="label" style="text-align:center">${S.scratched ? "Your prize" : "Scratch to reveal your prize"}</p>
      <div class="scratch ${S.scratched?"open":""}" id="scratch">
        ${CONFIG.images.present ? `<img src="${esc(CONFIG.images.present)}" alt="Your birthday present">` : `<div class="ph">IMAGE: present<br>(add the present photo)</div>`}
        <canvas id="scratchCanvas" aria-label="Scratch card"></canvas></div>
      ${S.scratched ? `<p class="prizecap">${esc(CONFIG.prizeCaption)}</p>` : ""}`;
  return `<section class="finale">
    <div class="label">${S.mercy ? "Judge's mercy" : "Prize unlocked"} · ${t} / 25</div>
    <h1>${esc(CONFIG.closing)}</h1>${card}${claim}</section>`;
}

function vPassport() {
  const slots = CONFIG.stations.map((st,i) => {
    if (S.scores[i]!=null) return `<div class="slot">${icon(st.icon, st.color, "", st.fallback)}<small><b>${esc(st.venue)}</b></small><span class="badge">${esc(st.stamp)} · ${S.scores[i]}/5</span></div>`;
    if (i === S.station) return `<div class="slot now">${icon(st.icon, st.color, "", st.fallback)}<small><b>${esc(st.venue)}</b><br>Now · ${st.time.slice(0,5)}</small></div>`;
    return `<div class="slot locked"><div class="q">?</div><small>Locked · ${st.time.slice(0,5)}</small></div>`;
  }).join("");
  const prize = `<div class="slot prize"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFD166" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M3 12h18M12 8v13M12 8c-2-4-6-4-6-1.5S10 8 12 8zM12 8c2-4 6-4 6-1.5S14 8 12 8z"/></svg>
    <small style="font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase">${S.scratched ? "Prize claimed" : `Prize · needs ${CONFIG.passMark}`}</small></div>`;
  return `<section style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:30px">Passport</h2>
    <span class="meta">${S.scores.filter(x=>x!=null).length}/5 stamps</span></div>
    <div class="grid">${slots}${prize}</div></section>`;
}

function vGM() {
  if (!ui.gmOk) return `<section class="gm"><div class="label">Game master</div>
    <form id="gmForm" style="display:flex;flex-direction:column;gap:8px">${pinField("gp")}<p class="err" id="gerr"></p><button type="submit">Unlock</button></form></section>`;
  return `<section class="gm"><div class="label">Game master · organiser only</div>
    ${CONFIG.stations.map((s,i)=>`<div class="gmrow"><label for="gs${i}">${i+1}. ${esc(s.venue)}</label>
      <select id="gs${i}" data-gs="${i}"><option value="">–</option>${[1,2,3,4,5].map(n=>`<option ${S.scores[i]===n?"selected":""}>${n}</option>`).join("")}</select></div>`).join("")}
    <div class="label" style="padding-top:6px">Jump to station</div>
    <div class="row">${CONFIG.stations.map((s,i)=>`<button class="ghost" data-jump="${i}" style="min-width:48px">${i+1}</button>`).join("")}<button class="ghost" data-a="jumpfinale">Finale</button></div>
    <div class="row"><button class="ghost" data-a="reset" style="border-color:var(--pink);color:#c2183a">${ui.resetArmed ? "Tap again to erase everything" : "Reset the whole game"}</button>
    <button class="ghost" data-a="gmclose">Close</button></div></section>`;
}

function render() {
  let h = "";
  if (S.screen === "pack") h = vPack();
  else if (S.screen === "cover") h = vCover();
  else {
    h = topBar();
    if (ui.view === "passport") h += vPassport();
    else h += ({station:vStation, question:vQuestion, judge:vJudge, stamped:vStamped, finale:vFinale}[S.screen] || vStation)();
  }
  h += `<div class="foot"><button data-a="gm">Game master</button></div>`;
  if (ui.gmOpen) h += vGM();
  document.getElementById("app").innerHTML = h;
  if (S.screen === "finale" && ui.view === "flow") {
    const won = total() >= CONFIG.passMark || S.mercy;
    if (won && !ui.confetti) { ui.confetti = true; confetti(); }
    if (won && S.claimed && !S.scratched) initScratch();
  }
}
const go = (screen) => { S.screen = screen; ui.view = "flow"; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); };

function checkPin(inputId, errId) {
  const ok = document.getElementById(inputId).value === CONFIG.pin;
  if (!ok) document.getElementById(errId).textContent = "Wrong PIN. Try again.";
  return ok;
}

document.addEventListener("change", e => {
  const m = e.target.dataset.m;
  if (m) { S.missions[m] = e.target.checked; save(); render(); return; }
  const pk = e.target.dataset.p;
  if (pk !== undefined) { S.packed[pk] = e.target.checked; save(); render(); return; }
  const gs = e.target.dataset.gs;
  if (gs !== undefined) { S.scores[+gs] = e.target.value ? +e.target.value : null; save(); render(); }
});
document.addEventListener("input", e => { if (e.target.id === "jnote") ui.note = e.target.value; });
document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "judgePin" && checkPin("jp","jerr")) { ui.judgeOk = true; render(); }
  if (id === "claimForm" && checkPin("cp","cerr")) { S.claimed = true; save(); render(); }
  if (id === "mercyForm" && checkPin("mp","merr")) { S.mercy = true; ui.confetti = false; save(); render(); }
  if (id === "gmForm" && checkPin("gp","gerr")) { ui.gmOk = true; render(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const a = b.dataset.a;
  if (b.dataset.score) { ui.pick = +b.dataset.score; render(); return; }
  if (b.dataset.jump !== undefined) { const i = +b.dataset.jump; S.station = i; S.q = 0; S.redemption.active = false; ui.gmOpen = false; go("station"); return; }
  switch (a) {
    case "packed": go("cover"); break;
    case "start": go(S.screen === "cover" ? "station" : S.screen); break;
    case "view-flow": ui.view = "flow"; render(); break;
    case "view-passport": ui.view = "passport"; render(); break;
    case "questions": S.q = 0; go("question"); break;
    case "told":
      if (S.q + 1 < ST().questions.length) { S.q++; save(); render(); window.scrollTo({top:0}); }
      else { ui.judgeOk = false; ui.pick = null; ui.note = S.comments[S.station] || ""; go("judge"); }
      break;
    case "confirm": {
      S.scores[S.station] = ui.pick;
      ui.judgeOk = false; ui.pick = null; ui.note = "";
      if (S.redemption.active) { S.redemption.active = false; S.redemption.used = true; ui.confetti = false; go("finale"); }
      else { ui.fresh = true; go("stamped"); }
      break; }
    case "nextstation": S.station++; S.q = 0; go("station"); break;
    case "tofinale": go("finale"); break;
    case "redeem": { const low = lowest(); S.redemption = {active:true, used:false, station:low}; S.station = low; S.q = 0; go("question"); break; }
    case "gm": ui.gmOpen = !ui.gmOpen; ui.resetArmed = false; render(); if (ui.gmOpen) setTimeout(()=>document.querySelector(".gm")?.scrollIntoView({behavior:"smooth"}),50); break;
    case "gmclose": ui.gmOpen = false; render(); break;
    case "jumpfinale": S.station = 4; ui.gmOpen = false; go("finale"); break;
    case "reset":
      if (ui.resetArmed) { S = blank(); save(); Object.assign(ui, {view:"flow", gmOpen:false, gmOk:false, resetArmed:false, confetti:false}); render(); window.scrollTo({top:0}); }
      else { ui.resetArmed = true; render(); }
      break;
  }
});

function initScratch() {
  const box = document.getElementById("scratch"), c = document.getElementById("scratchCanvas");
  if (!box || !c) return;
  const paint = () => {
    const r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr;
    const ctx = c.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
    const g = ctx.createLinearGradient(0,0,r.width,r.height);
    g.addColorStop(0,"#FF4D6D"); g.addColorStop(.5,"#FFB3A7"); g.addColorStop(1,"#FFD166");
    ctx.fillStyle = g; ctx.fillRect(0,0,r.width,r.height);
    ctx.fillStyle = "rgba(20,33,61,.75)"; ctx.font = "700 14px 'IBM Plex Mono', monospace"; ctx.textAlign = "center";
    for (let y = 30; y < r.height; y += 44) for (let x = ((y/44)%2)*50 + 50; x < r.width + 60; x += 130) ctx.fillText("SCRATCH ✦", x, y);
    ctx.fillStyle = "#14213d"; ctx.font = "800 26px 'Bricolage Grotesque', sans-serif"; ctx.fillText("Scratch here", r.width/2, r.height/2 + 8);
    ctx.globalCompositeOperation = "destination-out";
    return ctx;
  };
  let ctx = paint(), down = false, n = 0;
  const img = box.querySelector("img"); if (img && !img.complete) img.onload = () => { ctx = paint(); };
  const at = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const scrape = e => {
    const [x,y] = at(e); ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI*2); ctx.fill();
    if (++n % 10 === 0) {
      const d = ctx.getImageData(0,0,c.width,c.height).data; let clear = 0, tot = 0;
      for (let i = 3; i < d.length; i += 64) { tot++; if (d[i] === 0) clear++; }
      if (clear / tot > .5) { S.scratched = true; save(); box.classList.add("open"); confetti(); setTimeout(render, 750); }
    }
  };
  c.addEventListener("pointerdown", e => { down = true; c.setPointerCapture(e.pointerId); scrape(e); });
  c.addEventListener("pointermove", e => { if (down) scrape(e); });
  c.addEventListener("pointerup", () => down = false);
  c.addEventListener("pointercancel", () => down = false);
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("confetti"); c.hidden = false;
  const ctx = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#FF4D6D","#FFB3A7","#FFD166","#06D6A0","#118AB2"];
  const P = Array.from({length:160}, () => ({x:Math.random()*c.width, y:-20-Math.random()*c.height*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, r:Math.random()*6.3, s:6+Math.random()*7, col:cols[Math.random()*5|0]}));
  let t = 0;
  (function f() {
    ctx.clearRect(0,0,c.width,c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .12; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if (++t < 220) requestAnimationFrame(f); else { ctx.clearRect(0,0,c.width,c.height); c.hidden = true; }
  })();
}

render();
</script>

</body></html>
